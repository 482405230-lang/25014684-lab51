<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Catalogue</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        .book-item {
            border: 1px solid #666;
            padding: 10px;
            margin: 8px 0;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <h1>Book Catalogue</h1>
    <div id="outputArea"></div>

<script>
fetch("book.xml")
.then(function(response) {
    return response.text();
})
.then(function(xmlText) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");

    const allBooks = xmlDoc.getElementsByTagName("book");
    const outputDiv = document.getElementById("outputArea");

    for (let i = 0; i < allBooks.length; i++) {
        const oneBook = allBooks[i];
        const title = oneBook.querySelector("title").textContent;
        const author = oneBook.querySelector("author").textContent;
        const price = oneBook.querySelector("price").textContent;

        const div = document.createElement("div");
        div.className = "book-item";
        div.innerHTML = `
            <strong>${title}</strong><br>
            Author: ${author}<br>
            Price: $${price}
        `;
        outputDiv.appendChild(div);
    }
})
.catch(function(error) {
    console.log("Error:", error);
    document.getElementById("outputArea").textContent = "Cannot load book.xml";
});
</script>
</body>
</html>
