<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profiles</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        .profile-item {
            border: 1px solid #666;
            padding: 10px;
            margin: 8px 0;
            max-width: 420px;
        }
    </style>
</head>
<body>
    <h1>User Profiles</h1>
    <div id="outputArea"></div>

<script>
fetch('userProfiles.json')
    .then(response => {
        if (!response.ok)
            throw new Error('Fetch error: ' + response.status)
        else
            return response.json();
    })
    .then(json => {
        const outputDiv = document.getElementById("outputArea");
        json.forEach(user => {
            const div = document.createElement("div");
            div.className = "profile-item";
            div.innerHTML = `
                <strong>${user.firstName} ${user.lastName}</strong><br>
                Email: ${user.email}<br>
                Date of Birth: ${user.dateOfBirth}<br>
                Theme: ${user.preferences.theme}<br>
                Language: ${user.preferences.language}<br>
                Notifications: ${user.preferences.notifications}<br>
                Address: ${user.address.street}, ${user.address.city}, ${user.address.state} ${user.address.zipCode}<br>
                Newsletter Subscription: ${user.subscription}
            `;
            outputDiv.appendChild(div);
        });
    })
    .catch(err => console.error('Fetch error: ' + err.message));
</script>
</body>
</html>
